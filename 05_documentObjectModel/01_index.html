<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Normal DOM Document</title>
  </head>
  <body style="background-color: black; color: aliceblue;">
    <div class="heading" id="title" style="font-size: xx-large;">
        <h1>Title</h1>
    </div>
    <div class="content" id="lorem" style="font-size: large;">
        <p id="123">
            Lorem ipsum dolor sit amet.
            <span id="toHide">Test text</span>
        </p>
    </div>


    <div class="learnQuerySelector" id="div1">
      <h2 id="a">Lorem A</h2>
      <h2 id="b">Lorem B</h2>
      <h2 class="c">Lorem C</h2>
      <input type="password" name="Password" id="Password">
    </div>


    <div class="learnQueryselectorWithList" id="ul">
      <ul>
        <li>one</li>
        <li>two</li>
        <li>three</li>
      </ul>
    </div>
  </body>
</html>


<script>
    // getElementById()
    const title = document.getElementById(`title`) // getElementsByClassName behave like this but it returns all elements who have same class in HTML Collection. It can be converted to array using Array.from()
    console.log(title.id)
    console.log(title.className)
    console.log(title.getAttribute('style')) // same can be done for id, class
    console.log(title.getAttribute('class'))

    title.setAttribute('id', 'idOfTitleChanged')
    console.log(title.getAttribute('id'))
    title.setAttribute('style', 'background-color: blue; font-size: xx-large;') // It overwrite the attribute

    title.style.backgroundColor = 'green'
    title.style = 'background-color: blue; font-size: small;'
    title.style.color = 'white'
    title.style.fontSize = 'xx-large'



    // ++++++++++++++++++++++++++++++++++++


    const p = document.getElementById('123')
    console.log(p.innerHTML)
    console.log(p.innerText)
    console.log(p.textContent)

    console.log(`========================`)

    const spanTag = document.getElementById('toHide')
    spanTag.style.display = 'none'
    console.log(p.innerHTML)
    console.log(p.innerText)
    console.log(p.textContent)



    console.log('================================')

    p.innerText = 'Hello Text is changed'
    console.log(p.innerHTML)

    //Reverting the condition back
    p.innerHTML = 'Lorem ipsum dolor sit amet.<span id="toHide">Test text</span>'
    // 


    p.textContent = 'Hello, Text is changed again'
    console.log(p.innerHTML)

    //Reverting the condition back
    p.innerHTML = 'Lorem ipsum dolor sit amet.\n<span id="toHide">Test text</span>'
    // 


    console.log(p.innerHTML)






    // / ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
    const h2A = document.querySelector('h2')
    console.log(`+++++++++++++++++++++++++++++++++++++++++++++++++++++`)
    console.log(h2A);

    const h2B = document.querySelector(`#b`)
    console.log(h2B);
    
    const h2C = document.querySelector('.c')
    console.log(h2C);
    
    const inputSelect = document.querySelector(`input[type='password']`)
    console.log(inputSelect);



    
    // +++++++++++++++++++++++++++++++++++++++++++++++++
    console.log(`UL with dom`)
    const myul = document.querySelector(`ul`)
    console.log(myul)
    
    const oneli = myul.querySelector('li')
    console.log(oneli)
    oneli.style.backgroundColor = 'yellow'
</script>
